<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>document.documentElement.classList.add('js')</script>
  <title>{% block title %}MeuAgendamento{% endblock %}</title>
  {% block favicon %}
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/img/favicon.svg" />
  {% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}

  <!-- Animações de entrada compartilhadas (leve: 1 observer, só opacity/transform) -->
  <script src="{{ asset('js/animacoes.js') }}"></script>
</body>
</html>
