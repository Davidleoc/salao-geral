{% extends "emails/email_base.html" %}

{% block title %}{{ titulo }} — {{ salao.nome }}{% endblock %}

{% block content %}
<h2 style="margin: 0 0 16px; font-size: 21px; font-weight: 800; color: #0f172a; line-height: 1.3;">{{ titulo }}</h2>
{% for p in paragrafos %}
  <p style="margin: 0 0 14px; font-size: 15px; color: #475569; line-height: 1.6;">{{ p }}</p>
{% endfor %}
{% if botao_texto and botao_url %}
  <div style="margin: 26px 0 8px; text-align: center;">
    <a href="{{ botao_url }}" class="button-cta" style="display: inline-block; background-color: {{ cor_primaria }}; color: #ffffff; text-decoration: none; font-weight: 700; padding: 13px 28px; border-radius: 8px;">{{ botao_texto }}</a>
  </div>
{% endif %}
{% endblock %}
